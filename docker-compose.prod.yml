# Production stack. Standalone file, not an override of docker-compose.yml
# (compose's list-merge semantics for `ports:` are easy to get wrong across
# versions — a full second file removes the ambiguity entirely). Run with:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences from docker-compose.yml:
#   - db, gotrue, iam-server publish no host ports at all — caddy is the
#     only public entry point, on the internal compose network.
#   - caddy terminates TLS (automatic via Let's Encrypt) for two
#     subdomains: $AUTH_DOMAIN (-> gotrue) and $IAM_DOMAIN (-> iam-server).
#     Two subdomains, not one path-split domain, because the browser must
#     be able to reach GoTrue's /authorize and its own OAuth-provider
#     callback directly at a public URL — see Caddyfile.
#   - GOTRUE_MAILER_AUTOCONFIRM is off; GOTRUE_SMTP_* is required.
#
# Single iam-server instance only — its OAuth login state is kept
# in-process (memstore), so `--scale iam-server=N` for N>1 will randomly
# fail logins whose /callback lands on a different replica than /login
# did. See README "Going to production" for the full checklist this pairs
# with, and the note there if this ever needs to scale out.
services:
  # One Postgres instance shared by GoTrue and IAM — see docker-compose.yml
  # and scripts/db-init.sh for why this isn't two separate database servers.
  db:
    image: postgres:15.19
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 2s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:15.19
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      IAM_DB_USER: ${IAM_DB_USER:-iam}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD}
    volumes:
      - ./scripts/db-init.sh:/db-init.sh:ro
    entrypoint: ["bash", "/db-init.sh"]
    restart: "no"

  gotrue:
    image: supabase/gotrue:v2.195.0
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${AUTH_DOMAIN}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST}

      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated

      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}

      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${GOTRUE_RATE_LIMIT_EMAIL_SENT:-30}
      GOTRUE_PASSWORD_MIN_LENGTH: ${GOTRUE_PASSWORD_MIN_LENGTH:-8}

      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${AUTH_DOMAIN}/callback

  iam-server:
    build: .
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      gotrue:
        condition: service_healthy
    environment:
      IAM_ENV: production
      IAM_PORT: 8080
      SUPABASE_URL: https://${AUTH_DOMAIN} # public URL — the browser must reach GoTrue here too, see Caddyfile
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      IAM_CALLBACK_URL: https://${IAM_DOMAIN}/callback
      DATABASE_URL: postgresql://${IAM_DB_USER:-iam}:${IAM_DB_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_JWKS_EXTRA_KEYS: ${JWT_JWKS_EXTRA_KEYS:-[]}
      IAM_ALLOWED_APPS: ${IAM_ALLOWED_APPS}
      IAM_RATE_LIMIT_RPS: ${IAM_RATE_LIMIT_RPS:-1}
      IAM_RATE_LIMIT_BURST: ${IAM_RATE_LIMIT_BURST:-5}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      IAM_DOMAIN: ${IAM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - iam-server
      - gotrue

volumes:
  db-data:
  caddy-data:
  caddy-config:
